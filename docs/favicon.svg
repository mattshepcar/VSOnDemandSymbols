<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="bolt-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="greenGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#3CD070"/>
      <stop offset="45%" stop-color="#22B14C"/>
      <stop offset="100%" stop-color="#148038"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE0"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Green Play Arrow -->
  <path d="M 112,76 L 412,240 A 20,20 0 0 1 412,272 L 112,436 A 20,20 0 0 1 80,418 L 80,94 A 20,20 0 0 1 112,76 Z"
        fill="url(#greenGrad)"
        stroke="#0F5E28"
        stroke-width="5"
        filter="url(#shadow)" />

  <path d="M 86,98 L 390,250 L 86,250 Z"
        fill="url(#glossGrad)" />

  <!-- Centered Golden Lightning Bolt (Shifted down +36px) -->
  <path d="M 252,126 L 328,126 L 236,264 L 316,264 L 148,488 L 212,304 L 140,304 Z"
        fill="url(#goldGrad)"
        stroke="#1E1E1E"
        stroke-width="7"
        stroke-linejoin="round"
        filter="url(#bolt-shadow)" />
</svg>
